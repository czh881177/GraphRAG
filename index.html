<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医药 GraphRAG - 知识图谱问答系统</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8e 45%, #3b6f9e 100%);
            color: #e8eef5;
            overflow: hidden;
            height: 100vh;
        }
        #header {
            background: rgba(10, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }
        #header h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        #header .subtitle { font-size: 13px; color: #9fc3e8; font-weight: 400; }
        #header .tag {
            margin-left: auto; padding: 4px 14px; font-size: 11px; color: #cfe7ff;
            background: rgba(79, 195, 247, 0.15); border: 1px solid rgba(79, 195, 247, 0.35);
            border-radius: 20px; letter-spacing: 0.3px;
        }
        #header .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f77f00; display: inline-block; margin-right: 6px; }
        #header .status-dot.on { background: #52c41a; box-shadow: 0 0 6px #52c41a; }
        #container { display: flex; height: calc(100vh - 65px); }
        #sidebar {
            width: 360px; min-width: 300px;
            background: rgba(12, 28, 50, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px; overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 2px 0 14px rgba(0, 0, 0, 0.3);
        }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(79, 195, 247, 0.35); border-radius: 3px; }
        .section {
            margin-bottom: 14px; background: rgba(255, 255, 255, 0.05);
            padding: 14px 16px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            transition: all 0.25s ease;
        }
        .section:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(79, 195, 247, 0.3); }
        .section-title {
            font-size: 14px; font-weight: 600; margin-bottom: 10px;
            color: #4fc3f7; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .section-title .badge { font-size: 10px; color: #9fc3e8; background: rgba(255,255,255,0.08); padding: 1px 8px; border-radius: 10px; font-weight: 400; }
        .retrieval-selector { margin-bottom: 10px; }
        .retrieval-selector label { display: block; color: #9fc3e8; font-size: 12px; margin-bottom: 5px; }
        .retrieval-selector select {
            width: 100%; padding: 8px 10px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px;
            color: #fff; font-size: 13px; cursor: pointer; outline: none;
        }
        .retrieval-selector select:focus { border-color: #4fc3f7; }
        .retrieval-selector option { background: #12233d; color: #fff; }
        #question-input {
            width: 100%; min-height: 74px; padding: 10px 12px; margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px; color: #fff; font-size: 14px; font-family: inherit;
            resize: vertical; outline: none;
        }
        #question-input:focus { border-color: #4fc3f7; }
        #question-input::placeholder { color: #7a9cc0; }
        #ask-button {
            width: 100%; padding: 10px; background: linear-gradient(90deg, #4fc3f7, #3ba3d0);
            border: none; border-radius: 8px; color: #fff; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.25s;
        }
        #ask-button:hover { filter: brightness(1.12); transform: translateY(-1px); }
        #ask-button:disabled { background: #3a4a5c; cursor: not-allowed; transform: none; filter: none; }
        .test-title { font-size: 11px; color: #9fc3e8; margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
        .test-group { margin-bottom: 5px; }
        .test-group-label { font-size: 10px; color: #6f93b8; margin-bottom: 4px; }
        .test-btns { display: flex; flex-wrap: wrap; gap: 5px; }
        .test-btn {
            padding: 3px 9px; font-size: 10.5px; color: #cfe7ff;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px; cursor: pointer; transition: all 0.2s;
        }
        .test-btn:hover { background: rgba(79, 195, 247, 0.25); border-color: #4fc3f7; color: #fff; }
        #answer-box {
            margin-top: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
            border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e8f2; font-size: 13px; line-height: 1.7;
            max-height: 300px; overflow-y: auto; display: none;
        }
        #answer-box.visible { display: block; }
        .answer-label { color: #4fc3f7; font-weight: 600; margin-bottom: 8px; font-size: 12px; letter-spacing: 0.4px; }
        #answer-box ul, #answer-box ol { margin: 4px 0 4px 18px; }
        #answer-box p { margin: 4px 0; }
        .loading-spinner {
            display: inline-block; width: 12px; height: 12px; margin-right: 6px;
            border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%;
            border-top-color: #4fc3f7; animation: spin 0.8s linear infinite; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; padding: 7px 10px; background: rgba(255, 255, 255, 0.04); border-radius: 8px; }
        .stat:last-child { margin-bottom: 0; }
        .stat-label { color: #9fc3e8; font-size: 12.5px; }
        .stat-value { color: #4fc3f7; font-weight: 600; font-size: 13.5px; }
        .legend { display: flex; flex-direction: column; gap: 5px; }
        .legend-item {
            display: flex; align-items: center; gap: 10px; padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03); border-radius: 8px;
            cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
        }
        .legend-item:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(4px); }
        .legend-item.off { opacity: 0.35; }
        .legend-item.off .legend-color { background: #444 !important; }
        .legend-color { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); flex-shrink: 0; }
        .legend-label { font-size: 12.5px; color: #e0e8f2; }
        .legend-count { margin-left: auto; font-size: 11px; color: #7a9cc0; background: rgba(255, 255, 255, 0.08); padding: 1px 8px; border-radius: 10px; }
        #search-box {
            width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 8px;
            color: #fff; font-size: 13px; outline: none;
        }
        #search-box:focus { border-color: #4fc3f7; }
        #search-box::placeholder { color: #7a9cc0; }
        .search-hint { font-size: 11px; color: #6f93b8; margin-top: 6px; }
        #graph-container { flex: 1; position: relative; background: rgba(10, 24, 42, 0.45); overflow: hidden; }
        #status {
            position: absolute; top: 16px; left: 16px; padding: 6px 16px;
            background: rgba(8, 20, 36, 0.8); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px; font-size: 12px; color: #4fc3f7; z-index: 10;
            backdrop-filter: blur(6px);
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 16px; color: #4fc3f7; display: none; letter-spacing: 1px;
        }
        #details-panel {
            position: absolute; top: 64px; left: 16px; max-width: 300px; min-width: 200px;
            background: rgba(8, 20, 36, 0.94); padding: 14px 16px; border-radius: 12px;
            display: none; z-index: 10; border: 1px solid rgba(79, 195, 247, 0.35);
            backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #details-panel .d-name { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        #details-panel .d-type { font-size: 11px; color: #4fc3f7; margin-bottom: 8px; }
        #details-panel .d-edges { font-size: 12px; color: #b8cfe8; line-height: 1.7; max-height: 180px; overflow-y: auto; }
        #details-panel .d-close {
            position: absolute; top: 8px; right: 10px; background: none; border: none;
            color: #7a9cc0; font-size: 16px; cursor: pointer;
        }
        #details-panel .d-close:hover { color: #fff; }
        .zoom-controls {
            position: absolute; top: 16px; right: 16px;
            display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .zoom-btn {
            width: 38px; height: 38px; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px; color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; user-select: none;
        }
        .zoom-btn:hover { background: rgba(79, 195, 247, 0.3); border-color: #4fc3f7; transform: scale(1.08); }
        .zoom-btn.clear { font-size: 13px; }
        .node { cursor: pointer; }
        .node circle { stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.5px; transition: all 0.2s ease; }
        .node text {
            font-size: 11px; fill: #fff; font-weight: 600; text-anchor: middle;
            pointer-events: none;
        }
        .node:hover circle { stroke: #4fc3f7; stroke-width: 3px; }
        .node.hl circle { stroke: #ffd700; stroke-width: 3px; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8)); }
        .node.hl text { fill: #ffd700; }
        .node.dim { opacity: 0.12; }
        .link { stroke: rgba(160, 195, 230, 0.4); stroke-width: 1.2px; transition: all 0.2s ease; }
        .link.hl { stroke: #ffd700; stroke-width: 2.5px; filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.7)); }
        .link.dim { opacity: 0.06; }
    </style>
</head>
<body>
    <div id="header">
        <h1>💊 医药 GraphRAG 问答系统</h1>
        <div class="subtitle">知识图谱增强问答 · Neo4j + DeepSeek + 智谱 Embedding</div>
        <div class="tag"><span class="status-dot" id="status-dot"></span><span id="api-status">连接后端中…</span></div>
    </div>

    <div id="container">
        <div id="sidebar">
            <div class="section">
                <div class="section-title">🔍 GraphRAG 问答</div>
                <div class="retrieval-selector">
                    <label for="retrieval-method">检索方式</label>
                    <select id="retrieval-method">
                        <option value="vector">向量检索</option>
                        <option value="vector_cypher">向量 + 图遍历</option>
                        <option value="hybrid">混合检索</option>
                        <option value="hybrid_cypher" selected>混合 + 图遍历（推荐）</option>
                    </select>
                </div>
                <textarea id="question-input" placeholder="输入医药问题，例如：阿司匹林的作用机制是什么？"></textarea>
                <button id="ask-button" onclick="ask()">提问</button>
                <div class="test-title">📋 标准测试集</div>
                <div class="test-group">
                    <div class="test-group-label">单跳</div>
                    <div class="test-btns">
                        <button class="test-btn" onclick="q('阿司匹林的作用机制是什么？')">Q1 机制</button>
                        <button class="test-btn" onclick="q('哪些药物通过抑制环氧合酶发挥作用？')">Q2 药物</button>
                        <button class="test-btn" onclick="q('布洛芬有哪些副作用？')">Q3 副作用</button>
                        <button class="test-btn" onclick="q('拜耳研发了哪些药物？')">Q4 研发</button>
                    </div>
                </div>
                <div class="test-group">
                    <div class="test-group-label">多跳</div>
                    <div class="test-btns">
                        <button class="test-btn" onclick="q('服用阿司匹林会引发什么症状？')">Q5 症状</button>
                        <button class="test-btn" onclick="q('拜耳研发的药物有哪些副作用？')">Q6 副作用</button>
                    </div>
                </div>
                <div class="test-group">
                    <div class="test-group-label">反向 / 跨实体</div>
                    <div class="test-btns">
                        <button class="test-btn" onclick="q('环氧合酶与哪些药物有关？')">Q7 反向</button>
                        <button class="test-btn" onclick="q('哪些药物可以治疗头痛？')">Q9 治疗</button>
                        <button class="test-btn" onclick="q('长期服用布洛芬有什么风险？')">Q10 风险</button>
                    </div>
                </div>
                <div class="test-group">
                    <div class="test-group-label">对比</div>
                    <div class="test-btns">
                        <button class="test-btn" onclick="q('对乙酰氨基酚的作用机制与布洛芬有什么不同？')">Q8 对比</button>
                    </div>
                </div>
                <div id="answer-box"><div class="answer-label">💡 回答</div><div id="answer-content"></div></div>
            </div>

            <div class="section">
                <div class="section-title">📊 图谱统计 <span class="badge" id="stats-hint">/api/stats</span></div>
                <div class="stat"><span class="stat-label">实体数量</span><span class="stat-value" id="node-count">-</span></div>
                <div class="stat"><span class="stat-label">关系数量</span><span class="stat-value" id="edge-count">-</span></div>
            </div>

            <div class="section">
                <div class="section-title">🎨 实体类型 <span class="badge">点击过滤</span></div>
                <div class="legend" id="legend"></div>
            </div>

            <div class="section">
                <div class="section-title">🔎 搜索实体</div>
                <input type="text" id="search-box" placeholder="输入实体名称，如：阿司匹林" oninput="onSearch()">
                <div class="search-hint">按名称匹配，命中节点将高亮</div>
            </div>
        </div>

        <div id="graph-container">
            <div id="status">连接后端中…</div>
            <div id="loading">加载知识图谱…</div>
            <div id="details-panel">
                <button class="d-close" onclick="closeDetails()">✕</button>
                <div class="d-name" id="d-name"></div>
                <div class="d-type" id="d-type"></div>
                <div class="d-edges" id="d-edges"></div>
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in" title="放大">＋</button>
                <button class="zoom-btn" id="zoom-reset" title="重置">⊙</button>
                <button class="zoom-btn" id="zoom-out" title="缩小">－</button>
                <button class="zoom-btn clear" id="zoom-clear" title="清除高亮">✕</button>
            </div>
            <svg id="graph"></svg>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let graphData = { nodes: [], edges: [] };
        let svg, g, link, node, simulation, zoom;
        let offTypes = new Set();
        let highlightIds = new Set();

        const colorScheme = {
            '药物': '#f72585', '疾病': '#b380ff', '症状': '#4ecdc4',
            '作用机制': '#ffb347', '副作用': '#ef476f', '公司': '#06d6a0',
            '概念': '#8ecae6', 'Chunk': '#8d99ae', 'Document': '#6c757d',
            'default': '#95a5a6'
        };

        function getColor(type) { return colorScheme[type] || colorScheme['default']; }

        /* 节点半径：按文字长度自适应，保证文字完整在圆圈内 */
        function nodeR(d) {
            const byDegree = 5 + Math.min(11, (d.degree || 1) * 0.7);
            const byText = Math.ceil(d.label.length * 5.4) + 7;
            return Math.max(byDegree, byText, 10);
        }

        /* ---------- 图谱初始化 ---------- */
        function initGraph() {
            svg = d3.select('#graph');
            const container = document.getElementById('graph-container');
            const width = container.clientWidth, height = container.clientHeight;
            svg.attr('width', width).attr('height', height);
            zoom = d3.zoom().scaleExtent([0.05, 12]).on('zoom', (ev) => g.attr('transform', ev.transform));
            svg.call(zoom);
            g = svg.append('g');
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead').attr('viewBox', '0 -5 10 10')
                .attr('refX', 22).attr('refY', 0).attr('markerWidth', 6).attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#6f93b8');
            simulation = d3.forceSimulation()
                .force('link', d3.forceLink().id(d => d.id).distance(d => nodeR(d.source) + nodeR(d.target) + 24))
                .force('charge', d3.forceManyBody().strength(-520))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => nodeR(d) + 3));
            document.getElementById('zoom-in').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1.3));
            document.getElementById('zoom-out').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 0.72));
            document.getElementById('zoom-reset').addEventListener('click', () => svg.transition().call(zoom.transform, d3.zoomIdentity));
            document.getElementById('zoom-clear').addEventListener('click', clearHighlight);
        }

        function updateGraph(data) {
            graphData = data;
            const idSet = new Set(data.nodes.map(n => n.id));
            data.edges = data.edges.filter(e => idSet.has(e.source) && idSet.has(e.target));
            const edgeSet = new Set(data.edges.map(e => e.source + '->' + e.target));
            data.nodes.forEach(n => {
                n.degree = 0;
                data.edges.forEach(e => { if (e.source === n.id || e.target === n.id) n.degree++; });
            });
            link = g.selectAll('.link').data(data.edges, d => d.source + '->' + d.target)
                .join('path').attr('class', 'link').attr('marker-end', 'url(#arrowhead)');
            node = g.selectAll('.node').data(data.nodes, d => d.id)
                .join('g').attr('class', 'node')
                .call(d3.drag()
                    .on('start', (ev, d) => { if (!ev.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
                    .on('end', (ev, d) => { if (!ev.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
                .on('click', (ev, d) => showDetails(d));
            node.append('circle')
                .attr('r', d => nodeR(d))
                .attr('fill', d => getColor(d.type));
            node.append('text')
                .attr('dy', '.35em')
                .text(d => d.label);
            simulation.nodes(data.nodes).on('tick', ticked);
            simulation.force('link').links(data.edges);
            simulation.alpha(1).restart();
            applyFilters();
        }

        function ticked() {
            link.attr('d', d => {
                const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                const rr = nodeR(d.source);
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const sx = d.source.x + dx / len * rr, sy = d.source.y + dy / len * rr;
                return `M${sx},${sy}L${d.target.x},${d.target.y}`;
            });
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        }

        function applyFilters() {
            if (!node) return;
            node.classed('dim', d => offTypes.has(d.type) && !highlightIds.has(d.id))
                .classed('hl', d => highlightIds.has(d.id));
            link.classed('dim', d => {
                const st = d.source && d.source.type !== undefined ? d.source.type : null;
                const tt = d.target && d.target.type !== undefined ? d.target.type : null;
                return offTypes.has(st) || offTypes.has(tt);
            }).classed('hl', d => {
                const s = d.source && d.source.id !== undefined ? d.source.id : d.source;
                const t = d.target && d.target.id !== undefined ? d.target.id : d.target;
                return highlightIds.has(s) && highlightIds.has(t);
            });
        }

        /* ---------- 数据加载 ---------- */
        async function loadGraph() {
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            status.textContent = '连接后端中…';
            try {
                const res = await fetch(API_BASE + '/graph');
                const data = await res.json();
                updateGraph(data);
                status.innerHTML = `已连接 · ${data.nodes.length} 实体 · ${data.edges.length} 关系`;
                document.getElementById('status-dot').classList.add('on');
                document.getElementById('api-status').textContent = '后端已连接';
            } catch (e) {
                status.textContent = '⚠ 无法连接后端，请先运行 .venv\\Scripts\\python.exe -m backend.api';
                document.getElementById('api-status').textContent = '后端未连接';
            }
            loading.style.display = 'none';
        }

        async function loadStats() {
            try {
                const r = await fetch(API_BASE + '/stats');
                const s = await r.json();
                document.getElementById('node-count').textContent = s.total_nodes;
                document.getElementById('edge-count').textContent = s.total_relationships;
                const legend = document.getElementById('legend');
                legend.innerHTML = '';
                const types = s.nodes_by_type || {};
                Object.entries(types).sort((a, b) => b[1] - a[1]).forEach(([t, c]) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.innerHTML = `<span class="legend-color" style="background:${getColor(t)}"></span>
                        <span class="legend-label">${t}</span><span class="legend-count">${c}</span>`;
                    item.onclick = () => toggleType(t, item);
                    legend.appendChild(item);
                });
            } catch (e) { /* 后端未连时忽略 */ }
        }

        /* ---------- 问答 ---------- */
        function mdToHtml(s) {
            const esc = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            const lines = esc.split('\n');
            let html = '', inUl = false, inOl = false;
            for (const raw of lines) {
                const line = raw.trim();
                if (/^[-*•]\s+/.test(line)) {
                    if (inOl) { html += '</ol>'; inOl = false; }
                    if (!inUl) { html += '<ul>'; inUl = true; }
                    html += '<li>' + line.replace(/^[-*•]\s+/, '') + '</li>';
                } else if (/^\d+[.、]\s+/.test(line)) {
                    if (inUl) { html += '</ul>'; inUl = false; }
                    if (!inOl) { html += '<ol>'; inOl = true; }
                    html += '<li>' + line.replace(/^\d+[.、]\s+/, '') + '</li>';
                } else {
                    if (inUl) { html += '</ul>'; inUl = false; }
                    if (inOl) { html += '</ol>'; inOl = false; }
                    if (line) html += '<p>' + line + '</p>';
                }
            }
            if (inUl) html += '</ul>';
            if (inOl) html += '</ol>';
            return html;
        }

        async function ask() {
            const input = document.getElementById('question-input');
            const q = input.value.trim();
            if (!q) { input.focus(); return; }
            const btn = document.getElementById('ask-button');
            const box = document.getElementById('answer-box');
            const content = document.getElementById('answer-content');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 思考中…';
            box.classList.add('visible');
            content.innerHTML = '<span class="loading-spinner"></span> 正在检索知识图谱并生成答案…';
            const method = document.getElementById('retrieval-method').value;
            try {
                const r = await fetch(API_BASE + '/graphrag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q, method: method })
                });
                const data = await r.json();
                content.innerHTML = mdToHtml(data.answer || '（无答案返回）');
                highlightSubgraph(data.subgraph);
            } catch (e) {
                content.innerHTML = '❌ 请求失败：' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '提问';
            }
        }

        function q(text) {
            document.getElementById('question-input').value = text;
            ask();
        }

        function highlightSubgraph(sub) {
            highlightIds.clear();
            if (sub && sub.nodes) sub.nodes.forEach(n => highlightIds.add(n.id));
            if (sub && sub.edges) sub.edges.forEach(e => { highlightIds.add(e.source); highlightIds.add(e.target); });
            applyFilters();
        }

        function clearHighlight() {
            highlightIds.clear();
            applyFilters();
            closeDetails();
        }

        /* ---------- 类型过滤 ---------- */
        function toggleType(type, el) {
            if (offTypes.has(type)) offTypes.delete(type); else offTypes.add(type);
            el.classList.toggle('off', offTypes.has(type));
            applyFilters();
        }

        /* ---------- 搜索 ---------- */
        async function onSearch() {
            const kw = document.getElementById('search-box').value.trim();
            highlightIds.clear();
            if (kw) {
                try {
                    const r = await fetch(API_BASE + '/search?q=' + encodeURIComponent(kw));
                    const d = await r.json();
                    (d.results || []).forEach(x => highlightIds.add(x.id));
                } catch (e) { /* 忽略 */ }
            }
            applyFilters();
        }

        /* ---------- 节点详情 ---------- */
        function showDetails(d) {
            document.getElementById('d-name').textContent = d.label;
            document.getElementById('d-type').textContent = '类型：' + d.type + ' · 度：' + (d.degree || 0);
            const relOf = (e) => {
                const s = e.source && e.source.id !== undefined ? e.source.id : e.source;
                const t = e.target && e.target.id !== undefined ? e.target.id : e.target;
                return { s, t };
            };
            const related = graphData.edges
                .filter(e => { const r = relOf(e); return r.s === d.id || r.t === d.id; })
                .slice(0, 30)
                .map(e => {
                    const r = relOf(e);
                    const other = r.s === d.id ? r.t : r.s;
                    const n = graphData.nodes.find(x => x.id === other);
                    return `${d.label} —[${e.type}]→ ${n ? n.label : other}`;
                });
            document.getElementById('d-edges').innerHTML = related.length
                ? related.join('<br>') : '<span style="color:#6f93b8">暂无关联关系</span>';
            document.getElementById('details-panel').style.display = 'block';
        }

        function closeDetails() { document.getElementById('details-panel').style.display = 'none'; }

        /* ---------- 启动 ---------- */
        window.addEventListener('resize', () => {
            if (!svg) return;
            const c = document.getElementById('graph-container');
            svg.attr('width', c.clientWidth).attr('height', c.clientHeight);
        });
        initGraph();
        loadGraph();
        loadStats();
    </script>
</body>
</html>
