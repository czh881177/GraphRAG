    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #graph-container {
            flex: 1;
            position: relative;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            color: #4fc3f7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 13px;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .legend {
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
        }

        .node text {
            font-size: 12px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
        }

        .link {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2px;
        }

        .link-label {
            font-size: 10px;
            fill: #b0b0b0;
            text-anchor: middle;
            pointer-events: none;
        }

        .node:hover circle {
            stroke: #4fc3f7;
            stroke-width: 3px;
        }

        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #4caf50;
        }
    </style>
</head>

RT_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:459", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:399", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:460", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:400", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:461", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:401", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:462", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:402", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:0", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:403", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:1", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:404", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:2", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:405", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:3", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:406", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:4", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:407", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:5", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:408", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:6", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:409", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:7", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:410", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:8", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:411", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:9", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:427", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:10", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:428", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:11", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:429", "type": "PART_OF"}, {"source": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:12", "target": "4:b92d6a2c-6b1d-401e-af76-5a2a39b438c9:430", "type": "PART_OF"}]
        };

        // Color map for entity types
        const colorMap = {
            "药物": "#e74c3c",
            "疾病": "#8e44ad",
            "症状": "#f39c12",
            "公司": "#2980b9",
            "人物": "#27ae60",
            "作用机制": "#16a085",
            "副作用": "#d35400"
        };

        // Update statistics
        document.getElementById('node-count').textContent = graphData.nodes.length;
        document.getElementById('edge-count').textContent = graphData.edges.length;

        // Create legend
        const types = [...new Set(graphData.nodes.map(n => n.type))];
        const legend = document.getElementById('legend');
        types.forEach(type => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background: ${colorMap[type] || '#95a5a6'}"></div>
                <span>${type}</span>
            `;
            legend.appendChild(item);
        });

        // Render graph
        const svg = d3.select('#graph');
        const width = document.getElementById('graph-container').clientWidth;
        const height = document.getElementById('graph-container').clientHeight;

        svg.attr('viewBox', [0, 0, width, height]);

        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.edges).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-500))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(30));

        // Create links
        const link = svg.append('g')
            .selectAll('line')
            .data(graphData.edges)
            .join('line')
            .attr('class', 'link')
            .attr('marker-end', 'url(#arrowhead)');

        // Create link labels
        const linkLabel = svg.append('g')
            .selectAll('text')
            .data(graphData.edges)
            .join('text')
            .attr('class', 'link-label')
            .text(d => d.type);

        // Create nodes
        const node = svg.append('g')
            .selectAll('g')
            .data(graphData.nodes)
            .join('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        node.append('circle')
            .attr('r', 15)
            .attr('fill', d => colorMap[d.type] || '#95a5a6');

        node.append('text')
            .attr('dy', 30)
            .text(d => d.label);

        // Define arrow marker
        svg.append('defs').append('marker')
            .attr('id', 'arrowhead')
            .attr('viewBox', '-0 -5 10 10')
            .attr('refX', 25)
            .attr('refY', 0)
            .attr('orient', 'auto')
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .append('svg:path')
            .attr('d', 'M 0,-5 L 10,0 L 0,5')
            .attr('fill', 'rgba(255, 255, 255, 0.3)');

        // Update positions on tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            linkLabel
                .attr('x', d => (d.source.x + d.target.x) / 2)
                .attr('y', d => (d.source.y + d.target.y) / 2);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
    <script>
        window.addEventListener("message", function(e) {
            if (!e.data) return;

            // 重置所有样式
            if (e.data.type === "reset") {
                d3.selectAll(".node circle")
                    .attr("fill", null)
                    .attr("r", null)
                    .attr("stroke", null)
                    .attr("stroke-width", null);
                d3.selectAll(".edge line")
                    .attr("stroke", null)
                    .attr("stroke-width", null);
                return;
            }

            // 高亮目标节点和连线
            if (e.data.type === "highlight") {
                const highlightList = e.data.nodes.map(function(item) {
                    return String(item).trim();
                });

                // 先全部重置
                d3.selectAll(".node circle")
                    .attr("fill", null)
                    .attr("r", null)
                    .attr("stroke", null)
                    .attr("stroke-width", null);
                d3.selectAll(".edge line")
                    .attr("stroke", null)
                    .attr("stroke-width", null);

                // 高亮节点：同时匹配id和name
                d3.selectAll(".node circle")
                    .filter(function(d) {
                        var idMatch = highlightList.indexOf(String(d.id).trim()) > -1;
                        var nameMatch = highlightList.indexOf(String(d.name).trim()) > -1;
                        return idMatch || nameMatch;
                    })
                    .attr("fill", "#ef4444")
                    .attr("r", 14)
                    .attr("stroke", "#ffffff")
                    .attr("stroke-width", 2);

                // 高亮连线：两端节点都在高亮列表中
                d3.selectAll(".edge line")
                    .filter(function(d) {
                        var sId = highlightList.indexOf(String(d.source).trim()) > -1;
                        var sName = highlightList.indexOf(String(d.source_name).trim()) > -1;
                        var tId = highlightList.indexOf(String(d.target).trim()) > -1;
                        var tName = highlightList.indexOf(String(d.target_name).trim()) > -1;
                        return (sId || sName) && (tId || tName);
                    })
                    .attr("stroke", "#ef4444")
                    .attr("stroke-width", 2.5);
            }
        });
    </script>
