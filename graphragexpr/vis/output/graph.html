    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #graph-container {
            flex: 1;
            position: relative;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            color: #4fc3f7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 13px;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .legend {
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
        }

        .node text {
            font-size: 12px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
        }

        .link {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2px;
        }

        .link-label {
            font-size: 10px;
            fill: #b0b0b0;
            text-anchor: middle;
            pointer-events: none;
        }

        .node:hover circle {
            stroke: #4fc3f7;
            stroke-width: 3px;
        }

        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #4caf50;
        }
    </style>
</head>

1ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:250", "type": "副作用"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:7", "type": "治疗"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:6", "type": "治疗"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:5", "type": "治疗"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:4", "type": "治疗"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:3", "type": "治疗"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:429", "type": "作用于"}, {"source": "4:0979072f-21ca-4f2f-b27a-73598973bc41:427", "target": "4:0979072f-21ca-4f2f-b27a-73598973bc41:428", "type": "属于"}]
        };

        // Color map for entity types
        const colorMap = {
            "药物": "#e74c3c",
            "疾病": "#8e44ad",
            "症状": "#f39c12",
            "公司": "#2980b9",
            "人物": "#27ae60",
            "作用机制": "#16a085",
            "副作用": "#d35400"
        };

        // Update statistics
        document.getElementById('node-count').textContent = graphData.nodes.length;
        document.getElementById('edge-count').textContent = graphData.edges.length;

        // Create legend
        const types = [...new Set(graphData.nodes.map(n => n.type))];
        const legend = document.getElementById('legend');
        types.forEach(type => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background: ${colorMap[type] || '#95a5a6'}"></div>
                <span>${type}</span>
            `;
            legend.appendChild(item);
        });

        // Render graph
        const svg = d3.select('#graph');
        const width = document.getElementById('graph-container').clientWidth;
        const height = document.getElementById('graph-container').clientHeight;

        svg.attr('viewBox', [0, 0, width, height]);

        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.edges).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-500))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(30));

        // Create links
        const link = svg.append('g')
            .selectAll('line')
            .data(graphData.edges)
            .join('line')
            .attr('class', 'link')
            .attr('marker-end', 'url(#arrowhead)');

        // Create link labels
        const linkLabel = svg.append('g')
            .selectAll('text')
            .data(graphData.edges)
            .join('text')
            .attr('class', 'link-label')
            .text(d => d.type);

        // Create nodes
        const node = svg.append('g')
            .selectAll('g')
            .data(graphData.nodes)
            .join('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        node.append('circle')
            .attr('r', 15)
            .attr('fill', d => colorMap[d.type] || '#95a5a6');

        node.append('text')
            .attr('dy', 30)
            .text(d => d.label);

        // Define arrow marker
        svg.append('defs').append('marker')
            .attr('id', 'arrowhead')
            .attr('viewBox', '-0 -5 10 10')
            .attr('refX', 25)
            .attr('refY', 0)
            .attr('orient', 'auto')
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .append('svg:path')
            .attr('d', 'M 0,-5 L 10,0 L 0,5')
            .attr('fill', 'rgba(255, 255, 255, 0.3)');

        // Update positions on tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            linkLabel
                .attr('x', d => (d.source.x + d.target.x) / 2)
                .attr('y', d => (d.source.y + d.target.y) / 2);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
