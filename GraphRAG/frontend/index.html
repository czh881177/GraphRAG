<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红楼梦 GraphRAG - 知识图谱问答系统</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        #header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
        }

        #header .subtitle {
            font-size: 14px;
            color: #b0b0b0;
            font-weight: 400;
        }

        #container {
            display: flex;
            height: calc(100vh - 85px);
        }

        #sidebar {
            width: 350px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
        }

        #sidebar::-webkit-scrollbar {
            width: 6px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(79, 195, 247, 0.3);
            border-radius: 3px;
        }

        .section {
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .section:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(79, 195, 247, 0.3);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4fc3f7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .retrieval-selector {
            margin-bottom: 10px;
        }

        .retrieval-selector label {
            display: block;
            color: #b0b0b0;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .retrieval-selector select {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .retrieval-selector select:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        .retrieval-selector option {
            background: #1a1a2e;
            color: #fff;
        }

        #question-input {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 10px;
        }

        #question-input:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        #ask-button {
            width: 100%;
            padding: 10px;
            background: #4fc3f7;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        #ask-button:hover {
            background: #3ba3d0;
        }

        #ask-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #answer-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        #answer-box.visible {
            display: block;
        }

        .answer-label {
            color: #4fc3f7;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4fc3f7;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #search-box {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }

        #search-box:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 13px;
        }

        .stat-value {
            color: #4fc3f7;
            font-weight: 600;
            font-size: 14px;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .legend-label {
            font-size: 13px;
            color: #e0e0e0;
        }

        .legend-count {
            margin-left: auto;
            font-size: 12px;
            color: #888;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        #graph-container {
            flex: 1;
            position: relative;
            background: rgba(26, 26, 46, 0.5);
            overflow: hidden;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            font-size: 12px;
            color: #4fc3f7;
            z-index: 10;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4fc3f7;
            display: none;
        }

        #details-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            display: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #graph {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph:active {
            cursor: grabbing;
        }

        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .zoom-btn:hover {
            background: rgba(79, 195, 247, 0.3);
            border-color: #4fc3f7;
            transform: scale(1.1);
        }

        .node {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.5));
            transition: all 0.2s ease;
        }

        .node text {
            font-size: 11px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        }

        .node:hover circle {
            stroke: #4fc3f7;
            stroke-width: 3px;
        }

        .node.highlighted circle {
            stroke: #ffd700;
            stroke-width: 4px;
            filter: drop-shadow(0 0 8px #ffd700);
        }

        .link {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 1.5px;
            fill: none;
            transition: all 0.2s ease;
        }

        .link.highlighted {
            stroke: #ffd700;
            stroke-width: 3px;
        }

        .link-label {
            font-size: 9px;
            fill: #999;
            text-anchor: middle;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🏮 红楼梦 GraphRAG</h1>
        <div class="subtitle">知识图谱问答系统 - Knowledge Graph Question Answering</div>
    </div>

    <div id="container">
        <div id="sidebar">
            <div class="section">
                <div class="section-title">GraphRAG 问答</div>
                <div class="retrieval-selector">
                    <label for="retrieval-method">检索方式:</label>
                    <select id="retrieval-method">
                        <option value="vector">向量检索 (VectorRetriever)</option>
                        <option value="vector_cypher" selected>向量+图遍历 (VectorCypherRetriever)</option>
                        <option value="hybrid">混合检索 (HybridRetriever)</option>
                        <option value="hybrid_cypher">混合+图遍历 (HybridCypherRetriever)</option>
                    </select>
                </div>
                <textarea id="question-input" placeholder="输入问题..."></textarea>
                <button id="ask-button">提问</button>
                <div id="answer-box"></div>
            </div>

            <div class="section">
                <div class="section-title">搜索</div>
                <input type="text" id="search-box" placeholder="搜索实体...">
            </div>

            <div class="section">
                <div class="section-title">统计信息</div>
                <div id="stats">
                    <div class="stat">
                        <span class="stat-label">实体数量</span>
                        <span class="stat-value" id="node-count">-</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">关系数量</span>
                        <span class="stat-value" id="edge-count">-</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">实体类型</div>
                <div class="legend" id="legend"></div>
            </div>
        </div>

        <div id="graph-container">
            <div id="status">连接中...</div>
            <div id="loading">加载知识图谱...</div>
            <div id="details-panel"></div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in" title="放大">+</button>
                <button class="zoom-btn" id="zoom-reset" title="重置">⊙</button>
                <button class="zoom-btn" id="zoom-out" title="缩小">−</button>
            </div>
            <svg id="graph"></svg>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        let graphData = { nodes: [], edges: [] };
        let svg, g, simulation, link, node, zoom;

        // Color scheme for different entity types
        const colorScheme = {
            '人物': '#ff6b6b',
            '地点': '#4ecdc4',
            '物品': '#ffe66d',
            '概念': '#a8dadc',
            '药物': '#f72585',
            '疾病': '#7209b7',
            '作用机制': '#3a0ca3',
            '副作用': '#f77f00',
            '公司': '#06ffa5',
            'default': '#95a5a6'
        };

        function getNodeColor(type) {
            return colorScheme[type] || colorScheme['default'];
        }

        // Initialize D3 force simulation
        function initGraph() {
            svg = d3.select('#graph');
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            svg.attr('width', width).attr('height', height);

            // Create zoom behavior
            zoom = d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            // Create main group for zooming/panning
            g = svg.append('g');

            // Initialize force simulation
            simulation = d3.forceSimulation()
                .force('link', d3.forceLink().id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            // Zoom controls
            document.getElementById('zoom-in').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 1.3);
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 0.7);
            });

            document.getElementById('zoom-reset').addEventListener('click', () => {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
        }

        function updateGraph(data) {
            graphData = data;

            // Update links
            link = g.selectAll('.link')
                .data(data.edges, d => `${d.source}-${d.target}`)
                .join('path')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrowhead)');

            // Update link labels
            const linkLabel = g.selectAll('.link-label')
                .data(data.edges, d => `${d.source}-${d.target}`)
                .join('text')
                .attr('class', 'link-label')
                .text(d => d.type);

            // Update nodes
            const nodeGroup = g.selectAll('.node')
                .data(data.nodes, d => d.id)
                .join('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragStarted)
                    .on('drag', dragged)
                    .on('end', dragEnded));

            nodeGroup.selectAll('*').remove();

            nodeGroup.append('circle')
                .attr('r', 8)
                .attr('fill', d => getNodeColor(d.type));

            nodeGroup.append('text')
                .attr('dy', 20)
                .text(d => d.label);

            node = nodeGroup;

            // Update simulation
            simulation.nodes(data.nodes);
            simulation.force('link').links(data.edges);
            simulation.alpha(1).restart();

            simulation.on('tick', () => {
                link.attr('d', d => {
                    const dx = d.target.x - d.source.x;
                    const dy = d.target.y - d.source.y;
                    const dr = Math.sqrt(dx * dx + dy * dy);
                    return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
                });

                linkLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);

                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });

            updateLegend(data.nodes);
        }

        function updateLegend(nodes) {
            const typeCounts = {};
            nodes.forEach(node => {
                typeCounts[node.type] = (typeCounts[node.type] || 0) + 1;
            });

            const legend = document.getElementById('legend');
            legend.innerHTML = '';

            Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `
                    <div class="legend-color" style="background: ${getNodeColor(type)}"></div>
                    <div class="legend-label">${type}</div>
                    <div class="legend-count">${count}</div>
                `;
                legend.appendChild(item);
            });
        }

        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('status').textContent = data.status === 'ok' ? '✓ 已连接' : '✗ 连接失败';
                document.getElementById('status').style.color = data.status === 'ok' ? '#4fc3f7' : '#f44336';
            } catch (error) {
                document.getElementById('status').textContent = '✗ 无法连接';
                document.getElementById('status').style.color = '#f44336';
            }
        }

        async function loadGraph() {
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/graph`);
                const data = await response.json();

                updateGraph(data);

                document.getElementById('node-count').textContent = data.nodes.length;
                document.getElementById('edge-count').textContent = data.edges.length;

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading graph:', error);
                document.getElementById('loading').textContent = '加载失败';
            }
        }

        // GraphRAG question answering
        document.getElementById('ask-button').addEventListener('click', async () => {
            const question = document.getElementById('question-input').value.trim();
            const method = document.getElementById('retrieval-method').value;

            if (!question) return;

            const askButton = document.getElementById('ask-button');
            const answerBox = document.getElementById('answer-box');

            // Disable button and show loading
            askButton.disabled = true;
            askButton.innerHTML = '<span class="loading-spinner"></span> 思考中...';
            answerBox.className = 'visible';
            answerBox.innerHTML = '<div class="loading-spinner"></div> 正在检索知识图谱...';

            try {
                const response = await fetch(`${API_BASE}/graphrag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        method: method
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Display answer
                    const methodLabel = {
                        'vector': '向量检索',
                        'vector_cypher': '向量+图遍历',
                        'hybrid': '混合检索',
                        'hybrid_cypher': '混合+图遍历'
                    }[data.method] || data.method;

                    answerBox.innerHTML = `
                        <div class="answer-label">回答 (${methodLabel}):</div>
                        <div>${data.answer}</div>
                        ${data.subgraph && data.subgraph.nodes ? `<div style="margin-top: 10px; color: #4fc3f7;">使用了 ${data.subgraph.nodes.length} 个节点和 ${data.subgraph.edges.length} 条关系</div>` : ''}
                    `;

                    // Highlight subgraph if available
                    if (data.subgraph && data.subgraph.nodes) {
                        highlightSubgraph(data.subgraph);
                    }
                } else {
                    answerBox.innerHTML = `<div style="color: #f44336;">错误: ${data.error || '请求失败'}</div>`;
                }
            } catch (error) {
                console.error('Error asking question:', error);
                answerBox.innerHTML = `<div style="color: #f44336;">错误: ${error.message}</div>`;
            } finally {
                askButton.disabled = false;
                askButton.textContent = '提问';
            }
        });

        // Highlight subgraph nodes and edges
        function highlightSubgraph(subgraph) {
            // Clear previous highlights
            d3.selectAll('.node').classed('highlighted', false);
            d3.selectAll('.link').classed('highlighted', false);

            if (!subgraph || !subgraph.nodes || !subgraph.edges) return;

            const nodeIds = new Set(subgraph.nodes.map(n => n.id));
            const edgeSet = new Set(subgraph.edges.map(e => `${e.source}-${e.target}`));

            // Highlight nodes
            d3.selectAll('.node')
                .filter(d => nodeIds.has(d.id))
                .classed('highlighted', true);

            // Highlight edges
            d3.selectAll('.link')
                .filter(d => edgeSet.has(`${d.source.id}-${d.target.id}`) ||
                            edgeSet.has(`${d.target.id}-${d.source.id}`))
                .classed('highlighted', true);
        }

        // Search functionality
        document.getElementById('search-box').addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) return;

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                console.log('Search results:', data.results);
                // Highlight matching nodes
                if (data.results && data.results.length > 0) {
                    const resultIds = new Set(data.results.map(r => r.id));
                    d3.selectAll('.node').classed('highlighted', d => resultIds.has(d.id));
                }
            } catch (error) {
                console.error('Error searching:', error);
            }
        });

        // Initialize
        initGraph();
        checkHealth();
        loadGraph();
        setInterval(checkHealth, 10000); // Check health every 10 seconds
    </script>
</body>
</html>
